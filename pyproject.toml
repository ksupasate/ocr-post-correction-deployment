[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "ocr-risk"
version = "0.1.0"
description = "Source-grounded risk control for OCR post-correction under cross-engine distribution shift"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Supasate Vorathammathorn" }]
keywords = [
  "ocr",
  "post-correction",
  "risk-control",
  "selective-prediction",
  "calibration",
  "distribution-shift",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.26,<3.0",
  "pandas>=2.1,<3.0",
  "pyarrow>=15.0",
  "pydantic>=2.6,<3.0",
  "pyyaml>=6.0,<7.0",
  "typer>=0.12,<1.0",
  "rich>=13.7",
  "scipy>=1.11,<2.0",
  "scikit-learn>=1.4,<2.0",
  "pillow>=10.2",
  "rapidfuzz>=3.6,<4.0",
  "matplotlib>=3.8,<4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "hypothesis>=6.100",
  "ruff>=0.5",
  "mypy>=1.10",
  "pandas-stubs>=2.1",
  "types-PyYAML>=6.0",
  "pre-commit>=3.7",
]
# Heavy / platform-specific OCR backends. Never required for core install or CI.
#
# Note: the Tesseract adapter shells out to the `tesseract` binary and parses its TSV
# output, so it needs NO Python package — only `brew install tesseract` (plus
# `tesseract-lang` for non-English traineddata). There is deliberately no `tesseract`
# extra, because listing one would imply a dependency that does not exist.
paddle = ["paddleocr>=2.7", "paddlepaddle>=2.6"]
# imagecodecs: EasyOCR decodes images through scikit-image, which needs it for
# LZW-compressed TIFF. Without it, four historical pages in the pilot corpus failed to
# recognize under EasyOCR alone -- and a page missing from one engine breaks the
# matched-source premise the whole cross-engine comparison rests on.
easyocr = ["easyocr>=1.7", "imagecodecs>=2026.3.6"]
doctr = ["python-doctr[torch]>=0.8"]
torch = ["torch>=2.2", "transformers>=4.40"]
llm = ["anthropic>=0.40", "openai>=1.30"]
docs = ["mkdocs-material>=9.5", "mkdocstrings[python]>=0.25"]
all-engines = [
  # tesseract needs only the binary; see the note above.
  "paddleocr>=2.7",
  "paddlepaddle>=2.6",
  "easyocr>=1.7",
  "imagecodecs>=2026.3.6",
  "python-doctr[torch]>=0.8",
]

[project.scripts]
ocr-risk = "ocr_risk.cli.app:main"

[project.urls]
Repository = "https://github.com/ksupasate/ocr-risk"

[tool.hatch.build.targets.wheel]
packages = ["src/ocr_risk"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "B",    # flake8-bugbear
  "C4",   # comprehensions
  "UP",   # pyupgrade
  "SIM",  # simplify
  "RUF",  # ruff-specific
  "N",    # pep8-naming
  "ANN",  # annotations
  "PTH",  # use pathlib
  "NPY",  # numpy legacy random
]
ignore = [
  "ANN401",  # Any is occasionally required at adapter boundaries
  "B905",    # zip strict= is verbose in hot loops; handled case by case
  "N803",    # allow mathematical argument names (X, O, G, Y)
  "N806",    # allow mathematical local names
]

[tool.ruff.lint.per-file-ignores]
# Tests for the Unicode policy must spell out the confusable characters they fold.
"tests/**" = ["ANN", "E501", "RUF001", "RUF003"]
"scripts/**" = ["ANN"]
# The ambiguous-character lint is correct in general and wrong here: this module's whole
# purpose is a folding table whose keys are the confusable characters themselves.
"src/ocr_risk/canonical/unicode_policy.py" = ["RUF001", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["ocr_risk"]

[tool.mypy]
python_version = "3.11"
files = ["src/ocr_risk"]
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
  "sklearn.*",
  "scipy.*",
  "matplotlib.*",
  "rapidfuzz.*",
  "pyarrow.*",
  # Optional OCR backends: imported lazily inside availability()/recognize() and never
  # installed in CI, so mypy cannot see them. Their parse() paths are pure and typed.
  "pytesseract.*",
  "paddleocr.*",
  "easyocr.*",
  "doctr.*",
  "torch.*",
  "transformers.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
markers = [
  "slow: long-running tests excluded from the default fast loop",
  "requires_engine: needs a real OCR engine binary/model to be installed",
  "requires_network: downloads data; excluded from CI",
]
filterwarnings = ["error::DeprecationWarning:ocr_risk.*"]

[tool.ocr_risk.coverage]
# The floors `.claude/rules/tests.md` states, in the place the gate reads them, so the
# documented number and the enforced number cannot drift apart again. Enforced by
# `scripts/check_coverage.py`, which `make test` runs after pytest.
overall = 90.0

[tool.ocr_risk.coverage.paths]
# 100% where a silent wrong answer would invalidate results rather than crash:
# the leakage guards, the metric definitions, and the outcome taxonomy.
"src/ocr_risk/splits" = 100.0
"src/ocr_risk/metrics" = 100.0
"src/ocr_risk/risk" = 100.0
"src/ocr_risk/edits/outcome.py" = 100.0
# The three stages that decide what the experiment measures. Not 100%: both carry
# defensive branches against malformed artifacts that a well-formed run cannot reach.
"src/ocr_risk/experiments/loeo_runner.py" = 90.0
"src/ocr_risk/evidence" = 90.0
"src/ocr_risk/calibrate" = 95.0

[tool.coverage.run]
source = ["src/ocr_risk"]
branch = true
omit = [
  # Heavy backends cannot be installed in CI; they are contract-tested via fixtures.
  "src/ocr_risk/engines/paddleocr.py",
  "src/ocr_risk/engines/easyocr.py",
  "src/ocr_risk/engines/doctr.py",
]

[tool.coverage.report]
# The global floor. The per-package floors live in [tool.ocr_risk.coverage] and are
# enforced by scripts/check_coverage.py, because coverage.py has no per-path mechanism.
fail_under = 90
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@overload",
]
