# Pipeline dry run: the full pilot configuration over a handful of pages per corpus.
#
# Exists because the pilot takes an hour of recognition and several minutes of alignment,
# candidate generation and crop materialization, and discovering a schema error at the end
# of that is an expensive way to find it. Same engines, same languages, same protocol --
# only the page count differs.
#
# NOT A RESULT. Eight pages per corpus cannot support any claim, and the run uses its own
# partition id so it can never be confused with, or overwrite, the frozen h1_pilot one.
#
# For each held-out engine e, the target engine contributes nothing to model fitting,
# calibrator fitting, confidence normalization, threshold selection, or hyperparameter
# selection. Four folds, one per engine.
#
# Read against pilot_in_engine_oracle.yaml, which differs in exactly one field
# (splits.protocol) so the contrast is attributable to the protocol and nothing else.
#
#   uv run python scripts/run_ocr_matrix.py            # one engine per process
#   uv run ocr-risk experiment run configs/experiments/pilot_loeo_zero_shot.yaml
#   uv run ocr-risk experiment run configs/experiments/pilot_in_engine_oracle.yaml
#   uv run ocr-risk analyze h1 --zero-shot pilot_loeo_zero_shot --oracle pilot_in_engine_oracle

extends:
  - ../base.yaml
  - ../datasets/pilot_corpora.yaml
  - ../engines/four_real.yaml
  - ../candidates/default.yaml
  - ../verifiers/ablation_all.yaml

name: pilot_dryrun
description: >-
  A few pages per corpus through every stage, to find errors before a run that takes an
  hour does. Not a result: the corpus is too small for any number it produces to mean
  anything, and it draws on its own partition so it cannot disturb the frozen one.
synthetic: false
seed: 20260818

splits:
  # Both H1 arms draw on ONE frozen partition. A per-experiment partition would
  # evaluate the two conditions on different documents and call the difference transfer.
  partition_id: pilot_dryrun
  protocol: loeo_zero_shot
  partition_seed: 20260818
  fit_fraction: 0.6
  calibrate_fraction: 0.2
  # Stratified by corpus so each role holds all three transcription conventions, and by
  # noise tertile so the low-noise stratum H4 is about exists in every role.
  stratify_by: [dataset_id, noise_tertile]
  allow_document_overlap: false
  selection_scope: fit_only

risk:
  # The pre-registered reporting grid. If no method reaches a feasible operating point at
  # any of them, that is the result: a coarser grid must not be substituted afterwards to
  # manufacture a non-zero number.
  epsilon_grid: [0.01, 0.005, 0.001]
  delta: 0.1
  controller: ltt_bentkus
  coverage_unit: site
  harm_policy: strict_worsening
  sensitivity_harm_policies: [strict_worsening, non_improving, exact_only]
  site_policy: argmax_above_tau
  n_threshold_grid: 200

stats:
  n_bootstrap: 10000
  ci_level: 0.95
  bootstrap_unit: document
  multiplicity: holm
  bootstrap_seed: 7

# `datasets:` replaces rather than merges, so the whole block is restated with caps.
datasets:
  - id: funsd
    enabled: true
    max_documents: 8
    params:
      split: training_data
  - id: cord
    enabled: true
    max_documents: 8
    params:
      split: test
  - id: ocrd_sbb
    enabled: true
    max_documents: 8
    params: {}
