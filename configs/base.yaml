# Defaults shared by every experiment.
#
# Anything here that can move a headline number is a deliberate, recorded choice. The
# resolved form of this file (including defaults filled in by the pydantic models) is what
# gets hashed into each run record.

name: base
description: Shared defaults. Not runnable on its own; extend it.
seed: 20260817
synthetic: false

alignment:
  use_geometry: true
  unicode_policy: nfc
  # Components below this confidence are AMBIGUOUS: kept, counted, and excluded from
  # evaluation. Never lower this to manufacture alignment coverage.
  min_align_confidence: 0.55
  anchor_min_length: 6
  max_block_chars: 400
  band_margin: 32
  max_anchor_cost: 0.85
  substitution_cost: 1.0
  insertion_cost: 1.0
  deletion_cost: 1.0
  confusable_substitution_cost: 0.6
  weight_char_agreement: 0.5
  weight_geometry: 0.3
  weight_uniqueness: 0.2

sites:
  # Clean sites are enumerated on purpose: overcorrection is unobservable without them.
  include_clean_sites: true
  max_site_chars: 64
  merge_adjacent_components: true

candidates:
  max_candidates_per_site: 8
  drop_identity_candidates: true

evidence:
  crop_padding_ratio: 0.25
  crop_padding_min_px: 4
  crop_target_height: 48
  crop_grayscale: true
  context_window_chars: 48

calibration:
  method: isotonic
  n_bins: 15
  binning: equal_mass

risk:
  epsilon_grid: [0.01, 0.005, 0.001]
  delta: 0.1
  controller: ltt_bentkus
  coverage_unit: site
  harm_policy: strict_worsening
  sensitivity_harm_policies: [strict_worsening, non_improving, exact_only]
  site_policy: argmax_above_tau
  n_threshold_grid: 200

splits:
  protocol: loeo_zero_shot
  partition_seed: 20260817
  fit_fraction: 0.6
  calibrate_fraction: 0.2
  stratify_by: [dataset_id, noise_tertile]
  few_shot_k: [5, 10, 25, 50]
  few_shot_repeats: 20
  allow_document_overlap: false
  selection_scope: fit_only

stats:
  n_bootstrap: 10000
  ci_level: 0.95
  bootstrap_unit: document
  multiplicity: holm
  bootstrap_seed: 7
